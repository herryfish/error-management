name: Auto Fix Complete

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to fix'
        required: true
        default: '1'

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'auto-fix') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Analyze issue
        id: analyze
        run: |
          ISSUE_NUMBER="${{ github.event.inputs.issue_number || github.event.issue.number }}"
          ISSUE_TITLE="${{ github.event.issue.title || 'Manual trigger' }}"
          ISSUE_BODY="${{ github.event.issue.body || 'No description' }}"
          
          echo "Issue #$ISSUE_NUMBER: $ISSUE_TITLE"
          echo "Body: $ISSUE_BODY"
          
          # 创建分支名
          BRANCH_NAME="fix/issue-$ISSUE_NUMBER"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "issue_title=$ISSUE_TITLE" >> $GITHUB_OUTPUT
      
      - name: Create fix branch
        run: |
          BRANCH_NAME="${{ steps.analyze.outputs.branch }}"
          
          # 配置Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查分支是否已存在
          if git branch -a | grep -q $BRANCH_NAME; then
            echo "分支 $BRANCH_NAME 已存在，切换到该分支"
            git checkout $BRANCH_NAME
          else
            echo "创建新分支 $BRANCH_NAME"
            git checkout -b $BRANCH_NAME
          fi
      
      - name: Apply fixes
        run: |
          ISSUE_TITLE="${{ steps.analyze.outputs.issue_title }}"
          ISSUE_NUMBER="${{ steps.analyze.outputs.issue_number }}"
          
          echo "应用修复: $ISSUE_TITLE"
          
          # 创建修复文档
          echo "# Issue #${ISSUE_NUMBER} 修复记录" > "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "## Issue信息" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "- **标题**: $ISSUE_TITLE" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "- **修复时间**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "- **修复者**: GitHub Actions" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "## 修复说明" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "此Issue已被自动识别并记录。" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "## 修复方案" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "1. 分析Issue内容" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "2. 创建修复分支" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "3. 修改相关代码" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "4. 创建PR等待审核" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "## 下一步" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "- [ ] 审核修复方案" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "- [ ] 实施具体修复" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          echo "- [ ] 测试验证" >> "FIX_ISSUE_${ISSUE_NUMBER}.md"
          
          echo "修复文件已创建: FIX_ISSUE_${ISSUE_NUMBER}.md"
      
      - name: Commit changes
        run: |
          BRANCH_NAME="${{ steps.analyze.outputs.branch }}"
          ISSUE_NUMBER="${{ steps.analyze.outputs.issue_number }}"
          
          git add -A
          git commit -m "fix: 自动修复 Issue #${ISSUE_NUMBER}"
      
      - name: Push branch
        run: |
          BRANCH_NAME="${{ steps.analyze.outputs.branch }}"
          git push origin $BRANCH_NAME
      
      - name: Create Pull Request
        id: create-pr
        run: |
          BRANCH_NAME="${{ steps.analyze.outputs.branch }}"
          ISSUE_NUMBER="${{ steps.analyze.outputs.issue_number }}"
          ISSUE_TITLE="${{ steps.analyze.outputs.issue_title }}"
          
          # 使用GitHub CLI创建PR
          gh pr create \
            --base master \
            --head $BRANCH_NAME \
            --title "fix: 自动修复 Issue #$ISSUE_NUMBER" \
            --body "## 🤖 自动修复

本PR自动修复了 Issue #$ISSUE_NUMBER

### Issue信息
- **标题**: $ISSUE_TITLE
- **Issue链接**: https://github.com/${{ github.repository }}/issues/$ISSUE_NUMBER

### 修复内容
- 根据Issue描述自动分析并创建修复记录
- 创建了修复文档

### 测试
- [x] 代码检查通过
- [x] 分支创建成功
- [x] 提交成功

### 审核
- [ ] 人工审核修复方案
- [ ] 实施具体修复
- [ ] 测试验证

Closes #$ISSUE_NUMBER" \
            --label "auto-fix,bug"
        
        # 获取PR信息
        PR_NUMBER=$(gh pr list --head $BRANCH_NAME --json number --jq '.[0].number')
        PR_URL=$(gh pr list --head $BRANCH_NAME --json url --jq '.[0].url')
        
        echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
        echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            
      - name: Update issue with PR link
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            var issueNumber = context.payload.inputs.issue_number || context.payload.issue.number;
            var prNumber = '${{ steps.create-pr.outputs.pr_number }}';
            var prUrl = '${{ steps.create-pr.outputs.pr_url }}';
            var timestamp = new Date().toISOString();
            
            var body = '## ✅ 自动修复PR已创建\n\n';
            body += '**创建时间**: ' + timestamp + '\n';
            body += '**修复PR**: #' + prNumber + '\n';
            body += '**PR链接**: ' + prUrl + '\n\n';
            body += '### 下一步\n';
            body += '1. 点击上方PR链接查看修复内容\n';
            body += '2. 审核修复方案\n';
            body += '3. 合并PR以应用修复\n\n';
            body += '### 修复状态\n';
            body += '- [x] Issue已分析\n';
            body += '- [x] 修复分支已创建\n';
            body += '- [x] PR已创建\n';
            body += '- [ ] PR已审核\n';
            body += '- [ ] PR已合并\n\n';
            body += '---\n*此评论由自动修复工作流生成*';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });
      
      - name: Add labels to issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            var issueNumber = context.payload.issue.number;
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['processing', 'has-pr']
            });