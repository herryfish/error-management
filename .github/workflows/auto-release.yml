name: Auto Release

# PR 合入 master 后自动发布：
# 1. 若 PR 已显式修改根目录 package.json 的 version（与最新 tag 不一致），直接使用该版本发布；
# 2. 否则按合入的提交信息推断 bump 类型（feat!:/BREAKING CHANGE → major，feat: → minor，其余 → patch）。
# 发布内容：同步 root/backend/frontend 的 package.json 版本号 → 打 tag → 创建 GitHub Release。
on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  # 发布完成后向被合入的 PR 发通知评论（issues API）需要此权限，
  # 首次真实运行（v1.2.0 发布）因缺此权限报 403，主体发布不受影响
  pull-requests: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # PR closed 事件默认检出的是 refs/pull/<n>/merge，squash 合入后与 master 不同，
          # 必须显式检出 master，才能基于合入后的真实历史打 tag。
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Determine version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Latest tag: ${LATEST_TAG:-none}"
          echo "Current package.json version: $CURRENT_VERSION"

          if [ -n "$LATEST_TAG" ] && [ "$CURRENT_VERSION" != "${LATEST_TAG#v}" ]; then
            # PR 显式声明了待发布版本（如版本修整 PR），直接采用
            NEW_VERSION="$CURRENT_VERSION"
            echo "Release mode: declared by PR (package.json version)"
          else
            # 版本号与最新 tag 一致：按提交信息推断 bump 类型
            if [ -n "$LATEST_TAG" ]; then
              COMMITS=$(git log ${LATEST_TAG}..HEAD --oneline)
            else
              COMMITS=$(git log --oneline)
            fi
            echo "$COMMITS"

            if echo "$COMMITS" | grep -q "BREAKING CHANGE\|feat!:"; then
              BUMP="major"
            elif echo "$COMMITS" | grep -q "feat:"; then
              BUMP="minor"
            else
              BUMP="patch"
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            case "$BUMP" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            echo "Release mode: inferred bump ($BUMP)"
          fi

          if ! [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json 版本号不是合法 semver（x.y.z）：$NEW_VERSION"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$NEW_VERSION" >/dev/null; then
            echo "::error::Tag v$NEW_VERSION 已存在，无法重复发布。请先调整 package.json 版本号。"
            exit 1
          fi

          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync versions in package files
        id: sync
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"

          for f in package.json backend/package.json frontend/package.json; do
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('$f', 'utf8'));
              pkg.version = '$NEW_VERSION';
              fs.writeFileSync('$f', JSON.stringify(pkg, null, 2) + '\n');
            "
          done

          # 同步根目录 package-lock.json 中记录的版本号，保证 npm ci 可用
          node -e "
            const fs = require('fs');
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            lock.version = '$NEW_VERSION';
            if (lock.packages) {
              for (const key of ['', 'backend', 'frontend']) {
                if (lock.packages[key]) lock.packages[key].version = '$NEW_VERSION';
              }
            }
            fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          "

          # 同步子包 lockfile 顶层版本号（子目录可独立开发，避免子 lock 版本永久漂移）
          node -e "
            const fs = require('fs');
            for (const f of ['backend/package-lock.json', 'frontend/package-lock.json']) {
              const lock = JSON.parse(fs.readFileSync(f, 'utf8'));
              lock.version = '$NEW_VERSION';
              if (lock.packages && lock.packages['']) lock.packages[''].version = '$NEW_VERSION';
              fs.writeFileSync(f, JSON.stringify(lock, null, 2) + '\\n');
            }
          "

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "版本号已是 $NEW_VERSION，无需提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            RANGE="${LATEST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          {
            echo "changelog<<CHANGELOG_EOF"
            git log $RANGE --pretty=format:"- %s" --no-merges
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Create tag
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # changelog 是提交 subject 拼接的自由文本（含引号/反引号/$(...)），
          # 必须经 env 注入而非内联展开，否则会被 shell 执行（同 auto-review 修复模式）
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          cat > release-notes.md <<'INSTALL_EOF'

          ## 安装部署

          ```bash
          git clone --branch v${{ steps.version.outputs.version }} https://github.com/${{ github.repository }}.git
          cd error-management
          cp .env.example .env   # 配置数据库与 LLM API Key
          docker compose up -d
          ```

          详细配置说明见 [README](https://github.com/${{ github.repository }}#readme)。
          INSTALL_EOF

          {
            echo "## 更新内容"
            echo ""
            printf '%s\n' "$CHANGELOG"
            cat release-notes.md
          } > release-notes-full.md

          gh release create "v${{ steps.version.outputs.version }}" \
            --title "Release v${{ steps.version.outputs.version }}" \
            --notes-file release-notes-full.md

      - name: Notify merged PR
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            var version = process.env.RELEASE_VERSION;
            var releaseUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/releases/tag/v' + version;
            var body = '## ✅ Release v' + version + ' 已发布\n\n' +
              '- GitHub Release: ' + releaseUrl + '\n' +
              '- 版本号已同步至根目录、`backend/`、`frontend/` 的 `package.json`\n';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });
