name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: error_management_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Lint (backend + frontend)
        run: npm run lint

      - name: Run Backend Tests
        run: npm run test
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: password
          DB_DATABASE: error_management_test
          JWT_SECRET: test-secret

      - name: Build (backend + frontend)
        run: npm run build

  # DC-481：生产路径可构建性回归防护——新 clone 直接按生产 Dockerfile 构建两个镜像，
  # 防止 lockfile/依赖失同步再次导致生产构建破坏
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image (production Dockerfile)
        run: docker build -f backend/Dockerfile .

      - name: Build frontend image (production Dockerfile)
        run: docker build -f frontend/Dockerfile .

  deploy:
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Server via SSH
        # DC-481：构建失同步已修复，移除 continue-on-error 掩蔽，deploy 失败必须可见
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/error-management || exit 0
            git pull origin master
            docker-compose up -d --build
