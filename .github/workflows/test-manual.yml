name: Test Manual Trigger

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to test'
        required: true
        default: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Test manual trigger
        run: |
          echo "Manual trigger test successful!"
          echo "Issue number: ${{ github.event.inputs.issue_number }}"
          echo "Timestamp: $(date)"
      
      - name: Create test comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.inputs.issue_number;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## 手动触发测试成功！

**触发时间**: ${new Date().toISOString()}
**工作流**: Test Manual Trigger

这是一个手动触发的测试工作流，用于验证工作流配置是否正确。`
            });