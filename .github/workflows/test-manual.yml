name: Test Manual Trigger

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to test'
        required: true
        default: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Test manual trigger
        run: |
          echo "Manual trigger test successful!"
          echo "Issue number: ${{ github.event.inputs.issue_number }}"
          echo "Timestamp: $(date)"
      
      - name: Create test comment
        uses: actions/github-script@v7
        with:
          script: |
            var issueNumber = context.payload.inputs.issue_number;
            var timestamp = new Date().toISOString();
            var body = '## 手动触发测试成功！\n\n';
            body += '**触发时间**: ' + timestamp + '\n';
            body += '**工作流**: Test Manual Trigger\n\n';
            body += '这是一个手动触发的测试工作流，用于验证工作流配置是否正确。';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });
